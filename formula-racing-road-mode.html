<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Formula Racing</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif;touch-action:none}body{display:grid;place-items:center}#game{position:relative;width:min(100vw,calc(100vh * 440 / 760));aspect-ratio:440/760;overflow:hidden;border:2px solid #e10600;background:#111820;box-shadow:0 0 24px #e1060080}canvas{display:block;width:100%;height:100%}#ui{position:absolute;inset:12px 12px auto;display:flex;gap:8px;z-index:2}button,.pill{border:1px solid #ffffff30;border-radius:10px;background:#080c12d9;color:#fff;padding:9px 11px;font-weight:800}.pill{color:#ff5656}button:active{transform:scale(.95)}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#0008;border-radius:20px;padding:8px 13px;font-size:13px;z-index:2;white-space:nowrap;transition:.3s}.modal{display:none;position:absolute;inset:0;z-index:5;place-items:center;background:#030509d9}.card{width:80%;padding:24px;text-align:center;border-radius:16px;background:#141b25;border:1px solid #fff3;color:#fff}.card h1{margin:0 0 10px;color:#ff453e}.card button{margin:7px;width:85%;background:#d90707}.menu{display:none;position:absolute;z-index:4;top:58px;left:12px;width:245px;padding:14px;border-radius:14px;background:#0a0f17f5;color:#fff;border:1px solid #fff3}.menu.open{display:block}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.color{width:38px;height:38px;border-radius:50%;padding:0;background:var(--c)}.color.sel{outline:3px solid #fff}.small,.mode{width:100%;margin-top:10px;background:#202a36}.mode{text-align:left;margin-top:8px}.mode.active{background:#c90000;box-shadow:0 0 13px #f22}.label{font-size:12px;color:#bdc7d4;margin:13px 0 7px;text-transform:uppercase;letter-spacing:.7px}</style></head><body><div id="game"><canvas id="c"></canvas><div id="ui"><button id="menu">☰</button><div class="pill">Обгоны: <span id="score">0</span>/<span id="goal">50</span></div></div><div id="hint">Проводи пальцем по экрану, чтобы рулить</div><div id="settings" class="menu"><b>Настройки</b><div class="label">Режим гонки</div><button class="mode active" data-mode="normal">Обычный — 50 обгонов</button><button class="mode" data-mode="road">Дорожный — 500 обгонов</button><button class="mode" data-mode="hard">Хардмод — 150 обгонов</button><button class="mode" data-mode="extreme">Хардмод II — 500 обгонов</button><div class="label">Цвет болида</div><div class="colors"><button class="color sel" style="--c:#e10600" data-c="#e10600" data-a="#fff" data-d="#650000"></button><button class="color" style="--c:#1769ff" data-c="#1769ff" data-a="#fff" data-d="#071c68"></button><button class="color" style="--c:#00ad71" data-c="#00ad71" data-a="#dcfff3" data-d="#004d33"></button><button class="color" style="--c:#ff8900" data-c="#ff8900" data-a="#181818" data-d="#7a3b00"></button><button class="color" style="--c:#8d31e4" data-c="#8d31e4" data-a="#fff" data-d="#33085e"></button><button class="color" style="--c:#f5c400" data-c="#f5c400" data-a="#222" data-d="#806300"></button><button class="color" style="--c:#ec1762" data-c="#ec1762" data-a="#fff" data-d="#72072c"></button><button class="color" style="--c:#00a8e8" data-c="#00a8e8" data-a="#fff" data-d="#005071"></button></div><button class="small" id="continue">▶ Продолжить</button></div><div class="modal" id="overlay"><div class="card"><h1 id="title">АВАРИЯ</h1><p id="msg"></p><button id="restart">Начать заново</button></div></div></div><script>const c=document.querySelector('#c'),x=c.getContext('2d',{alpha:false,desynchronized:true}),scoreEl=document.querySelector('#score'),goalEl=document.querySelector('#goal'),hint=document.querySelector('#hint'),settings=document.querySelector('#settings'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),msg=document.querySelector('#msg');const W=440,H=760,road={l:48,r:392,w:344};let prev=null,run=true,settingsOpen=false,score=0,speed=460,offset=0,spawn=0,mode='normal';const modes={normal:{goal:50,start:460,add:42,delay:900,name:'Обычный'},road:{goal:500,start:460,add:42,delay:900,name:'Дорожный'},hard:{goal:150,start:820,add:68,delay:520,name:'Хардмод'},extreme:{goal:500,start:1080,add:92,delay:330,name:'Хардмод II'}};const p={x:220,y:625,tx:220,w:66,h:118,c:'#e10600',a:'#fff',d:'#650000'};let cars=[];const themes=[['#1769ff','#fff','#071c68'],['#ff8900','#181818','#7a3b00'],['#8d31e4','#fff','#33085e'],['#00ad71','#dcfff3','#004d33'],['#f5c400','#222','#806300'],['#ec1762','#fff','#72072c']];function resize(){let q=Math.min(devicePixelRatio||1,2.5);c.width=W*q;c.height=H*q;x.setTransform(q,0,0,q,0,0)}resize();addEventListener('resize',resize);function cl(v,a,b){return Math.max(a,Math.min(b,v))}function target(v){if(!run||settingsOpen)return;let r=c.getBoundingClientRect();p.tx=(v-r.left)/r.width*W;hint.style.opacity=0}c.ontouchstart=e=>{e.preventDefault();target(e.touches[0].clientX)};c.ontouchmove=e=>{e.preventDefault();target(e.touches[0].clientX)};c.onmousedown=e=>target(e.clientX);c.onmousemove=e=>{if(e.buttons)target(e.clientX)};function lane(n){return road.l+road.w/3*n+road.w/6}function make(){let t=themes[(Math.random()*themes.length)|0];cars.push({x:lane((Math.random()*3)|0),y:-140,w:61,h:110,c:t[0],a:t[1],d:t[2],pass:false})}function km(){return Math.round(cl(145+speed*.27,0,520))}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#192c38');g.addColorStop(1,'#05080d');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#0c131a';x.fillRect(0,0,48,H);x.fillRect(392,0,48,H);let a=x.createLinearGradient(48,0,392,0);a.addColorStop(0,'#464d55');a.addColorStop(.5,'#1c2127');a.addColorStop(1,'#464d55');x.fillStyle=a;x.fillRect(48,0,344,H);for(let y=-60+offset;y<H;y+=60){x.fillStyle='#e10600';x.fillRect(39,y,9,30);x.fillRect(392,y,9,30);x.fillStyle='#f2f2f2';x.fillRect(39,y+30,9,30);x.fillRect(392,y+30,9,30)}x.setLineDash([33,32]);x.strokeStyle='#ffffff70';x.lineWidth=3;[163,277].forEach(z=>{x.beginPath();x.moveTo(z,-80+offset);x.lineTo(z,H);x.stroke()});x.setLineDash([])}function tire(X,Y,w,h){x.fillStyle='#050608';x.fillRect(X,Y,w,h);x.fillStyle='#293039';x.fillRect(X+2,Y+4,w-4,h-8);x.fillStyle='#e6cf00';x.fillRect(X+1,Y+h*.43,w-2,2)}function car(q,me){let w=q.w,h=q.h;x.save();x.translate(q.x,q.y);if(me)x.rotate(cl((p.tx-p.x)*.0025,-.1,.1));x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.ellipse(0,h*.38,w*.6,h*.17,0,0,Math.PI*2);x.fill();x.fillStyle=q.d;x.fillRect(-w*.57,-h*.49,w*1.14,h*.1);x.fillRect(-w*.65,h*.4,w*1.3,h*.11);x.fillStyle=q.c;x.fillRect(-w*.5,-h*.51,w,h*.07);x.fillRect(-w*.57,h*.43,w*1.14,h*.07);tire(-w*.66,-h*.29,w*.19,h*.25);tire(w*.47,-h*.29,w*.19,h*.25);tire(-w*.7,h*.15,w*.24,h*.28);tire(w*.46,h*.15,w*.24,h*.28);let g=x.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,q.d);g.addColorStop(.2,q.c);g.addColorStop(.8,q.c);g.addColorStop(1,q.d);x.fillStyle=g;x.beginPath();x.moveTo(0,-h*.45);x.lineTo(w*.25,-h*.22);x.lineTo(w*.4,h*.18);x.lineTo(w*.2,h*.44);x.lineTo(0,h*.53);x.lineTo(-w*.2,h*.44);x.lineTo(-w*.4,h*.18);x.lineTo(-w*.25,-h*.22);x.fill();x.fillStyle=q.a;x.beginPath();x.moveTo(-w*.065,-h*.42);x.lineTo(w*.065,-h*.42);x.lineTo(w*.1,h*.3);x.lineTo(0,h*.45);x.lineTo(-w*.1,h*.3);x.fill();x.fillStyle='#050609';x.beginPath();x.ellipse(0,-h*.05,w*.18,h*.16,0,0,Math.PI*2);x.fill();x.fillStyle=me?'#ffd800':q.a;x.beginPath();x.arc(0,-h*.09,w*.1,0,Math.PI*2);x.fill();if(me){x.fillStyle='#090b0e';x.fillRect(-w*.25,h*.04,w*.5,h*.17);x.textAlign='center';x.fillStyle='#fff';x.font='bold 9px Arial';x.fillText('FORMULA',0,h*.09);x.fillStyle='#ff251c';x.font='bold 16px Arial';x.fillText('RACING',0,h*.17)}x.restore()}function meter(){let X=378,Y=65,R=44,s=km(),st=Math.PI*.75,en=Math.PI*2.25,a=st+(en-st)*s/520;x.save();x.fillStyle='#06090ee8';x.beginPath();x.arc(X,Y,R+8,0,7);x.fill();x.lineWidth=7;x.lineCap='round';x.strokeStyle='#303943';x.beginPath();x.arc(X,Y,R,st,en);x.stroke();let g=x.createLinearGradient(X-R,Y,X+R,Y);g.addColorStop(0,'#14d878');g.addColorStop(.6,'#f6df26');g.addColorStop(1,'#ff2d2d');x.strokeStyle=g;x.beginPath();x.arc(X,Y,R,st,a);x.stroke();x.strokeStyle='#ff3434';x.lineWidth=3;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*(R-11),Y+Math.sin(a)*(R-11));x.stroke();x.fillStyle='#ff3434';x.beginPath();x.arc(X,Y,5,0,7);x.fill();x.textAlign='center';x.fillStyle='#fff';x.font='bold 14px Arial';x.fillText(s,X,Y+17);x.fillStyle='#b9c4d0';x.font='bold 8px Arial';x.fillText('KM/H',X,Y+28);x.restore()}function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.3&&Math.abs(a.y-b.y)<(a.h+b.h)*.38}function update(dt){if(!run||settingsOpen)return;p.tx=cl(p.tx,91,349);p.x+=(p.tx-p.x)*(1-Math.exp(-15*dt));offset=(offset+speed*dt)%65;spawn+=dt*1000;let m=modes[mode],delay=Math.max(mode==='normal'||mode==='road'?550:220,m.delay-score*(mode==='normal'||mode==='road'?6:3));if(spawn>delay){make();spawn=0}for(let i=cars.length-1;i>=0;i--){let q=cars[i];q.y+=speed*dt;if(hit(p,q)){lose();return}if(!q.pass&&q.y>p.y+85){q.pass=true;score++;scoreEl.textContent=score;if(score%10===0)speed+=m.add;if(score>=m.goal){win();return}}if(q.y>H+130)cars.splice(i,1)}}function draw(){x.clearRect(0,0,W,H);bg();cars.forEach(q=>car(q,false));car(p,true);meter()}function loop(t){if(prev==null)prev=t;let dt=Math.min((t-prev)/1000,.033);prev=t;update(dt);draw();requestAnimationFrame(loop)}function lose(){run=false;overlay.style.display='grid';title.textContent='АВАРИЯ';msg.textContent='Ты врезался. Счёт обнулён.';score=0;scoreEl.textContent=0}function win(){run=false;overlay.style.display='grid';title.textContent='ПОБЕДА!';msg.textContent=`Ты прошёл режим «${modes[mode].name}»!`}function restart(){score=0;scoreEl.textContent=0;speed=modes[mode].start;offset=0;spawn=0;cars=[];p.x=p.tx=220;run=true;settingsOpen=false;settings.classList.remove('open');overlay.style.display='none';prev=null}document.querySelector('#restart').onclick=restart;document.querySelector('#menu').onclick=()=>{settingsOpen=!settingsOpen;settings.classList.toggle('open',settingsOpen);if(settingsOpen){prev=null;hint.style.opacity=0}};document.querySelector('#continue').onclick=()=>{settingsOpen=false;settings.classList.remove('open');prev=null};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(q=>q.classList.remove('active'));b.classList.add('active');goalEl.textContent=modes[mode].goal;restart()});document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{p.c=b.dataset.c;p.a=b.dataset.a;p.d=b.dataset.d;document.querySelectorAll('.color').forEach(q=>q.classList.remove('sel'));b.classList.add('sel')});requestAnimationFrame(loop);</script></div></body></html>
